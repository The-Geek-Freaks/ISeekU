name: Release

on:
  push:
    tags:
      - 'v*'
  # A tag pushed before Actions were enabled on this repository never triggered
  # a build, and there was no way to start one afterwards. This lets any
  # existing tag be built on demand.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v2.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux

    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.platform }})

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # A tag push already points at the tag; a manual run must be told.
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Verify tag matches package.json version
        shell: bash
        run: |
          PKG=$(node -p "require('./package.json').version")
          REF="${{ inputs.tag || github.ref_name }}"
          TAG="${REF#v}"
          echo "package.json=$PKG  tag=$TAG"
          if [ "$PKG" != "$TAG" ]; then
            echo "::error::Tag v$TAG does not match package.json version $PKG — aborting so we never ship mislabeled binaries again."
            exit 1
          fi

      - name: Install Linux system deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libnss3 \
            libatk-bridge2.0-0 \
            libdrm2 \
            libgbm1 \
            libasound2t64 \
            libxss1 \
            libxtst6 \
            libxrandr2 \
            libx11-xcb1 || true

      - name: Install dependencies
        run: npm ci
        env:
          PUPPETEER_CACHE_DIR: ./puppeteer_cache

      - name: Build React app
        run: npm run build
        env:
          CI: false

      - name: Build Electron - Windows
        if: matrix.os == 'windows-latest'
        run: npx electron-builder --win nsis portable --publish never

      - name: Build Electron - macOS
        if: matrix.os == 'macos-latest'
        run: npx electron-builder --mac dmg --arm64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Build Electron - Linux
        if: matrix.os == 'ubuntu-latest'
        run: npx electron-builder --linux AppImage deb --publish never

      # Upload build artifacts for the release job
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.platform }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: warn
          retention-days: 1

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    # Run even if some builds failed, so we publish whatever was built
    if: always()

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-all
          merge-multiple: true

      - name: List files
        run: find dist-all -type f | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ISeekU ${{ inputs.tag || github.ref_name }}
          tag_name: ${{ inputs.tag || github.ref_name }}
          body: |
            ICQ, rebuilt — numeric UINs, the Contact List, all eight Statuses —
            speaking XMPP against the icqr.net network, with WhatsApp and
            Telegram alongside it.

            ### Downloads

            | Platform | File | Notes |
            |---|---|---|
            | Windows | `ISeekU-Setup-*.exe` | Installer |
            | Windows | `ISeekU-*-Portable.exe` | No installation; keeps its data in `ICQ-Data` beside the executable |
            | macOS | `ISeekU-*.dmg` | arm64 — native on Apple silicon, Rosetta 2 on Intel |
            | Linux | `ISeekU-*.AppImage` | Portable, runs anywhere |
            | Linux | `iseeku_*.deb` | Debian and Ubuntu |

            No Android or iOS build. Electron does not run there — but
            icqr.net speaks standard XMPP, so any XMPP client reaches it.
            [Conversations](https://f-droid.org/packages/eu.siacs.conversations/)
            on Android, Monal or Siskin on iOS. Add `<your UIN>@132.145.202.182`
            and accept the unencrypted connection when asked.

            ### Before you sign in

            **The icqr.net server does not encrypt anything.** No STARTTLS,
            SASL PLAIN only — measured against the live service. Your password
            and every message cross the network readable by anyone on the path.

            ISeekU refuses to connect to such a server unless you say so, and
            it asks every session. The refusal happens before your password
            reaches the socket, and an account connected in the clear stays
            visibly marked while it is signed in.

            ### Unsigned builds

            Windows SmartScreen will warn on first run: *More info* →
            *Run anyway*.

            macOS blocks unnotarised apps. Once, in Terminal:

            ```
            xattr -cr /Applications/ISeekU.app
            ```

            Or right-click the app → *Open* → *Open*.

            ### Not affiliated

            with ICQ, its former owners, or the icqr.net project. The interface
            is an original recreation. Built on
            [Felix-Helleckes/ICQ](https://github.com/Felix-Helleckes/ICQ), MIT.

          draft: false
          prerelease: false
          generate_release_notes: false
          files: dist-all/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
